name: Weiktube Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retained player layout in Chromium (offline fixture)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/weiktube-layout" playwright-core@1.61.0
          WEIKTUBE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/weiktube-layout/node_modules/playwright-core" WEIKTUBE_CHROME_PATH="$(command -v google-chrome)" node scripts/check-player-layout.cjs
      - name: Verify filtering and existing navigation scripts
        run: |
          node scripts/vendor-adblock.mjs --check
          node scripts/check-adblock-scripts.cjs
          node scripts/test-gecko-adblock.mjs
          node scripts/check-player-scripts.cjs
          node scripts/check-native-pip-integration.cjs
          node scripts/check-playback-observer.cjs
          node scripts/check-browser-scripts.cjs
          node scripts/check-home-bridge.cjs
          node scripts/check-original-home-navigation.cjs
          node scripts/check-home-cold-start.mjs
          node scripts/check-watch-navigation.cjs
          python scripts/check-home-scope.py
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      # Do not publish CI debug APKs as updates: their signing identity differs
      # from the user-installed build. Releases must retain the original key.
